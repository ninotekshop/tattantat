# Build app Tất Tần Tật (Expo / React Native, thư mục mobile/) cho Android và iOS.
# Hướng dẫn thiết lập: docs/HUONG-DAN-PHAT-HANH-APP.md
#
# Nhóm biến môi trường cần tạo trong Codemagic (Team settings → Global variables and secrets):
#  - tattantat_mobile:
#      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID  Web Client ID (OAuth) dùng để lấy idToken đăng nhập Google
#      GOOGLE_IOS_URL_SCHEME             reversed iOS Client ID, vd com.googleusercontent.apps.123-abc
#      IOS_GOOGLE_SERVICES_PLIST         nội dung GoogleService-Info.plist mã hóa base64 (Secure)
#      ANDROID_GOOGLE_SERVICES_JSON      nội dung google-services.json mã hóa base64 (Secure)
#  - Với app quản trị (thư mục admin-app/), thêm vào nhóm tattantat_mobile biến tùy chọn ADMIN_GOOGLE_SERVICES_JSON
#    (google-services.json của ứng dụng Android com.tattantat.admin, mã hóa base64) để nhận thông báo đẩy.
#    Build bằng cách đẩy tag dạng admin-v1.0.0 (workflow admin-android-apk), tải .apk ở mục Artifacts.
#  - google_play: GCP_SERVICE_ACCOUNT_CREDENTIALS (JSON tài khoản dịch vụ Google Play, Secure)
# Nộp lên cửa hàng: đẩy tag store-vX.Y.Z (vd store-v1.0.0) -> workflow android-store + ios-store tự build rồi gửi
#   Google Play (track production) và App Store (gửi duyệt, phát hành thủ công sau khi Apple duyệt).
#   Tag app-v* vẫn chỉ đưa lên Internal testing (Google Play) và TestFlight để thử nghiệm.
# Ký app Android: Code signing identities → Android keystores, đặt tên tham chiếu "ninotek_upload_keystore".
# Ký app iOS: Developer Portal → App Store Connect API key tên "codemagic_app_store_connect" (tự tạo chứng chỉ và profile khi build).

definitions:
  env_common: &env_common
    node: 22.14.0
    groups:
      - tattantat_mobile
    vars:
      EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
      APP_VERSION: "1.0.1"
  install: &install
    name: Cài thư viện
    script: |
      cd mobile
      npm ci || npm install
      npx tsc --noEmit || echo "Cảnh báo: kiểm tra kiểu có lỗi (thường là kiểu của lucide-react-native), vẫn tiếp tục build."

workflows:
  android-release:
    name: Android — build .aab và đưa .aab lên Google Play (Internal testing)
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      <<: *env_common
      java: 17
      groups:
        - tattantat_mobile
        - google_play
      android_signing:
        - ninotek_upload_keystore
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.1"
        PACKAGE_NAME: "com.tattantat.app"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "app-v*"
    scripts:
      - *install
      - name: Số build (versionCode) tăng dần theo Google Play
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --credentials "$GCP_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null | grep -oE "[0-9]+" | tail -1 || true); LATEST=${LATEST:-0}; if [ "$LATEST" -lt "$PROJECT_BUILD_NUMBER" ]; then LATEST=$PROJECT_BUILD_NUMBER; fi
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Tệp cấu hình Firebase cho Android
        script: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode > mobile/google-services.json; fi
          test -f mobile/google-services.json || { echo "Thiếu google-services.json (biến ANDROID_GOOGLE_SERVICES_JSON)"; exit 1; }
      - name: Sinh mã native Android
        script: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install
      - name: Build Android App Bundle (.aab)
        script: |
          cd mobile/android
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCP_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  admin-android-apk:
    name: App quản trị — build .apk Android (cài trực tiếp, không cần Google Play)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22.14.0
      java: 17
      groups:
        - tattantat_mobile
      android_signing:
        - ninotek_upload_keystore
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.0"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "admin-v*"
    scripts:
      - name: Cài thư viện
        script: |
          cd admin-app
          npm ci || npm install
          npx tsc --noEmit || echo "Cảnh báo: kiểm tra kiểu có lỗi (thường là kiểu của lucide-react-native), vẫn tiếp tục build."
      - name: Số build (versionCode) theo số lần build của Codemagic
        script: echo "BUILD_NUMBER=$PROJECT_BUILD_NUMBER" >> $CM_ENV
      - name: Tệp cấu hình Firebase (tùy chọn, để nhận thông báo đẩy)
        script: |
          if [ -n "$ADMIN_GOOGLE_SERVICES_JSON" ]; then echo "$ADMIN_GOOGLE_SERVICES_JSON" | base64 --decode > admin-app/google-services.json; else echo "Không có ADMIN_GOOGLE_SERVICES_JSON: app vẫn build, chỉ không nhận thông báo đẩy."; fi
      - name: Sinh mã native Android
        script: |
          cd admin-app
          npx expo prebuild --platform android --clean --no-install
      - name: Build APK
        script: |
          cd admin-app/android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - admin-app/android/app/build/outputs/apk/release/*.apk

  ios-release:
    name: iOS — build .ipa và đưa lên TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_app_store_connect
    environment:
      <<: *env_common
      xcode: latest
      cocoapods: default
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.1"
        BUNDLE_ID: "com.tattantat.app"
        BUILD_PLATFORM: "ios"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "app-v*"
    scripts:
      - *install
      - name: Tệp cấu hình Firebase cho iOS
        script: |
          if [ -z "$IOS_GOOGLE_SERVICES_PLIST" ]; then echo "Thiếu biến IOS_GOOGLE_SERVICES_PLIST"; exit 1; fi
          echo "$IOS_GOOGLE_SERVICES_PLIST" | base64 --decode > mobile/GoogleService-Info.plist
      - name: Số build tăng dần theo TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --bundle-id-identifier "$BUNDLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Sinh mã native iOS và cài CocoaPods
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean --no-install
          # react-native-firebase không hỗ trợ SPM cùng liên kết static: tắt SPM của RNFirebase
          printf '$RNFirebaseDisableSPM = true\n' | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile
          cd ios && pod install
      - name: Lấy chứng chỉ và hồ sơ ký app từ Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
      - name: Áp dụng hồ sơ ký app
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE=$(ls -d mobile/ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME" || {
            echo "===== CÁC DÒNG LỖI TỪ XCODEBUILD ====="
            grep -h -B2 -A8 -E "error:|ARCHIVE FAILED|Signing for|No profile|Provisioning" /tmp/xcodebuild_logs/*.log | head -120
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  android-store:
    name: Android — NỘP LÊN GOOGLE PLAY (bản chính thức, gửi Google duyệt) khi đẩy tag store-v*
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      <<: *env_common
      java: 17
      groups:
        - tattantat_mobile
        - google_play
      android_signing:
        - ninotek_upload_keystore
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.1"
        PACKAGE_NAME: "com.tattantat.app"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "store-v*"
    scripts:
      - *install
      - name: Số build (versionCode) tăng dần theo Google Play
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --credentials "$GCP_SERVICE_ACCOUNT_CREDENTIALS" 2>/dev/null | grep -oE "[0-9]+" | tail -1 || true); LATEST=${LATEST:-0}; if [ "$LATEST" -lt "$PROJECT_BUILD_NUMBER" ]; then LATEST=$PROJECT_BUILD_NUMBER; fi
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Tệp cấu hình Firebase cho Android
        script: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode > mobile/google-services.json; fi
          test -f mobile/google-services.json || { echo "Thiếu google-services.json (biến ANDROID_GOOGLE_SERVICES_JSON)"; exit 1; }
      - name: Sinh mã native Android
        script: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install
      - name: Build Android App Bundle (.aab)
        script: |
          cd mobile/android
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCP_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false
        in_app_update_priority: 0

  ios-store:
    name: iOS — NỘP LÊN APP STORE (gửi Apple duyệt) khi đẩy tag store-v*
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_app_store_connect
    environment:
      <<: *env_common
      xcode: latest
      cocoapods: default
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.1"
        BUNDLE_ID: "com.tattantat.app"
        BUILD_PLATFORM: "ios"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "store-v*"
    scripts:
      - *install
      - name: Tệp cấu hình Firebase cho iOS
        script: |
          if [ -z "$IOS_GOOGLE_SERVICES_PLIST" ]; then echo "Thiếu biến IOS_GOOGLE_SERVICES_PLIST"; exit 1; fi
          echo "$IOS_GOOGLE_SERVICES_PLIST" | base64 --decode > mobile/GoogleService-Info.plist
      - name: Số build tăng dần theo TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --bundle-id-identifier "$BUNDLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Sinh mã native iOS và cài CocoaPods
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean --no-install
          # react-native-firebase không hỗ trợ SPM cùng liên kết static: tắt SPM của RNFirebase
          printf '$RNFirebaseDisableSPM = true\n' | cat - ios/Podfile > ios/Podfile.new && mv ios/Podfile.new ios/Podfile
          cd ios && pod install
      - name: Lấy chứng chỉ và hồ sơ ký app từ Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
      - name: Áp dụng hồ sơ ký app
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE=$(ls -d mobile/ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME" || {
            echo "===== CÁC DÒNG LỖI TỪ XCODEBUILD ====="
            grep -h -B2 -A8 -E "error:|ARCHIVE FAILED|Signing for|No profile|Provisioning" /tmp/xcodebuild_logs/*.log | head -120
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: MANUAL
