workflows:
  react-native-ios:
    name: React Native iOS App Store Build (.ipa)
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: app_store_credentials
    environment:
      node: 20.x
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.tattantat.app"
        # Địa chỉ API production. Đổi thành tên miền thật (hoặc khai báo trong nhóm biến của Codemagic).
        EXPO_PUBLIC_API_URL: "https://tattantat.example.com/api/v1"
    scripts:
      - name: Kiểm tra địa chỉ API production
        script: |
          case "$EXPO_PUBLIC_API_URL" in
            https://*example.com*|"") echo "EXPO_PUBLIC_API_URL chưa được đặt sang tên miền thật"; exit 1;;
          esac
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Expo Prebuild (Generate native iOS code)
        script: |
          cd mobile
          npx expo prebuild --platform ios
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS IPA package
        script: |
          WORKSPACE=$(find mobile/ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  react-native-android:
    name: React Native Android App Bundle (.aab) Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      node: 20.x
      java: 17
      groups:
        - google_play_credentials
      vars:
        PACKAGE_NAME: "com.tattantat.app"
        # Địa chỉ API production. Đổi thành tên miền thật (hoặc khai báo trong nhóm biến của Codemagic).
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
    scripts:
      - name: Kiểm tra địa chỉ API production
        script: |
          case "$EXPO_PUBLIC_API_URL" in
            https://*example.com*|"") echo "EXPO_PUBLIC_API_URL chưa được đặt sang tên miền thật"; exit 1;;
          esac
      - name: Install dependencies
        script: |
          cd mobile
          npm install
      - name: Expo Prebuild (Generate native Android code)
        script: |
          cd mobile
          npx expo prebuild --platform android
      - name: Build Android App Bundle (.aab)
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/apk/release/*.apk
    publishing:
      google_play:
        credentials: $GCP_SERVICE_ACCOUNT_KEY
        track: internal
