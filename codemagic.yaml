# Build app Tất Tần Tật (Expo / React Native, thư mục mobile/) cho Android và iOS.
# Hướng dẫn thiết lập: docs/HUONG-DAN-PHAT-HANH-APP.md
#
# Nhóm biến môi trường cần tạo trong Codemagic (Team settings → Global variables and secrets):
#  - tattantat_mobile:
#      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID  Web Client ID (OAuth) dùng để lấy idToken đăng nhập Google
#      GOOGLE_IOS_URL_SCHEME             reversed iOS Client ID, vd com.googleusercontent.apps.123-abc
#      IOS_GOOGLE_SERVICES_PLIST         nội dung GoogleService-Info.plist mã hóa base64 (Secure)
#      ANDROID_GOOGLE_SERVICES_JSON      nội dung google-services.json mã hóa base64 (Secure)
#  - google_play: GCP_SERVICE_ACCOUNT_CREDENTIALS (JSON tài khoản dịch vụ Google Play, Secure)
# Ký app Android: Code signing identities → Android keystores, đặt tên tham chiếu "tattantat_upload".
# Ký app iOS: Integrations → App Store Connect API key tên "tattantat_asc".

definitions:
  env_common: &env_common
    node: 22.14.0
    groups:
      - tattantat_mobile
    vars:
      EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
      APP_VERSION: "1.0.0"
  install: &install
    name: Cài thư viện
    script: |
      cd mobile
      npm ci || npm install
      npx tsc --noEmit

workflows:
  android-release:
    name: Android — build .aab và đưa lên Google Play (Internal testing)
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      <<: *env_common
      java: 17
      groups:
        - tattantat_mobile
        - google_play
      android_signing:
        - tattantat_upload
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.0"
        PACKAGE_NAME: "com.tattantat.app"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "app-v*"
    scripts:
      - *install
      - name: Số build (versionCode) tăng dần theo Google Play
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Tệp cấu hình Firebase cho Android
        script: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 --decode > mobile/google-services.json; fi
          test -f mobile/google-services.json || { echo "Thiếu google-services.json (biến ANDROID_GOOGLE_SERVICES_JSON)"; exit 1; }
      - name: Sinh mã native Android
        script: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install
      - name: Cấu hình ký app (upload key)
        script: |
          cat >> mobile/android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
              }
            }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - name: Build Android App Bundle
        script: |
          cd mobile/android
          ./gradlew bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCP_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-release:
    name: iOS — build .ipa và đưa lên TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: tattantat_asc
    environment:
      <<: *env_common
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tattantat.app
      vars:
        EXPO_PUBLIC_API_URL: "https://tattantat.vn/api/v1"
        APP_VERSION: "1.0.0"
        BUNDLE_ID: "com.tattantat.app"
        BUILD_PLATFORM: "ios"
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "app-v*"
    scripts:
      - *install
      - name: Tệp cấu hình Firebase cho iOS
        script: |
          if [ -z "$IOS_GOOGLE_SERVICES_PLIST" ]; then echo "Thiếu biến IOS_GOOGLE_SERVICES_PLIST"; exit 1; fi
          echo "$IOS_GOOGLE_SERVICES_PLIST" | base64 --decode > mobile/GoogleService-Info.plist
      - name: Số build tăng dần theo TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number --bundle-id-identifier "$BUNDLE_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Sinh mã native iOS và cài CocoaPods
        script: |
          cd mobile
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install
      - name: Áp dụng hồ sơ ký app
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          WORKSPACE=$(ls -d mobile/ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
